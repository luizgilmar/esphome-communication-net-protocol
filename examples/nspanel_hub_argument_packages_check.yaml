# Compile-only: virtual outputs, never install on a HUB.
packages:
  base: !include nspanel_hub_schema_check.yaml
  superior_arguments: !include
    file: ../packages/powered_rgb_light.yaml
    vars:
      rgb_binding_id: upper_package_rgb
      on_binding_id: upper_package_on
      off_binding_id: upper_package_off
      toggle_binding_id: upper_package_toggle
      get_binding_id: upper_package_get
      light_on_script_id: upper_power_on
      light_off_script_id: upper_power_off
      light_supply_group_id: shared_supply_group
      light_supply_release_delay: 1100ms
      brightness_binding_id: upper_package_brightness
      light_resource: light/package_upper
      light_execution_scope: light/shared_supply
      argument_light_id: check_strip
      light_supply_id: check_supply
      light_supply_settle: 300ms
      light_completion_timeout: 3s
  mesa_arguments: !include
    file: ../packages/powered_rgb_light.yaml
    vars:
      rgb_binding_id: mesa_package_rgb
      on_binding_id: mesa_package_on
      off_binding_id: mesa_package_off
      toggle_binding_id: mesa_package_toggle
      get_binding_id: mesa_package_get
      light_on_script_id: mesa_power_on
      light_off_script_id: mesa_power_off
      light_supply_group_id: shared_supply_group
      light_supply_release_delay: 1100ms
      brightness_binding_id: mesa_package_brightness
      light_resource: light/package_mesa
      light_execution_scope: light/shared_supply
      argument_light_id: check_mesa
      light_supply_id: check_supply
      light_supply_settle: 300ms
      light_completion_timeout: 3s
  position_arguments: !include
    file: ../packages/cover_position_binding.yaml
    vars:
      position_binding_id: package_position
      position_resource: cover/package_blind
      position_cover_id: check_cover
      position_timeout: 20s
esphome:
  name: hub-argument-packages-check
  build_path: ${protocol_build_root}/esphome-protocol-schema-build/hub-argument-packages-check
light:
  - {platform: rgb, id: check_mesa, red: check_output, green: check_output, blue: check_output}
  - {platform: monochromatic, id: check_supply, output: check_output}

communication_net_protocol:
  light_supplies:
    - id: shared_supply_group
      supply_id: check_supply
      members: [check_strip, check_mesa]
