# Reusable for an ESPHome time_based cover. Its native toggle owns the cycle.
# Include with vars: cycle_binding_id, cycle_resource, cycle_cover_id.
communication_net_protocol:
  inbound:
    bindings:
      - id: ${cycle_binding_id}
        resource: ${cycle_resource}
        command: cycle
        interrupt_via_stop: true
        then:
          - cover.toggle: ${cycle_cover_id}
        # Acknowledges dispatch, not a final position or confirmed movement.
        completion:
          delay: 50ms
          timeout: 1s

# Requires a stop binding for the same resource with interrupts_active and
# cover completion expected: idle, plus interruptible movement bindings.
# During a pending movement, the HUB uses only that stop binding. If the
# cover has already become idle it confirms idle without actuating it.
